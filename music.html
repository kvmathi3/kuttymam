
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- MP3 is in the root folder -->
    <audio id="birthdaySong"
           src="birthday-song.mp3"
           loop
           preload="auto">
    </audio>

    <iframe
        name="websiteFrame"
        src="index.html">
    </iframe>

    <script>
        const song = document.getElementById("birthdaySong");
        song.volume = 0.7;

        function playBirthdaySong() {
            if (song.paused) {
                song.play().catch(error => {
                    console.log("Browser requires a user click to play music.");
                });
            }
        }

        window.addEventListener("message", function(event) {
            if (event.data === "birthday-song-user-action") {
                playBirthdaySong();
            }
        });
    </script>

</body>
</html>
